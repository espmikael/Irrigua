  function saveForm(){
    syncForm();
    var f = sheet, s = sp(f.sp);
    var name = String(f.name || '').trim();
    var interval = parseInt(f.interval, 10);
    var last = parse(f.last);
    f.error = '';
    if (!s && !name) f.error = 'Dê um nome para a planta.';
    else if (!(interval >= 1 && interval <= 90)) f.error = 'O intervalo de rega precisa ser entre 1 e 90 dias.';
    else if (!last || last > TODAY) f.error = 'Escolha uma data de última rega até hoje.';
    else Object.keys(TASKS).forEach(function(k){ var t = f.tasks[k]; if (t.on && !(parseInt(t.interval, 10) >= 1 && parseInt(t.interval, 10) <= 180)) f.error = TASKS[k].label + ': o intervalo precisa ser entre 1 e 180 dias.'; });
    if (f.error) return renderForm();
    var old = f.edit ? find(f.id) : null;
    var tasks = {};
    Object.keys(TASKS).forEach(function(k){
      var t = f.tasks[k], prev = old && old.tasks && old.tasks[k];
      if (t.on) tasks[k] = { on:true, interval:parseInt(t.interval, 10), last:(prev && prev.last) || iso(TODAY) };
      else if (prev) tasks[k] = { on:false, interval:prev.interval, last:prev.last };
    });
    var data = { sp:f.sp, name:name, room:String(f.room || '').trim(), tasks:tasks, interval:interval, light:f.light, last:iso(last), photo:f.photo || null, cover:(f.photo && f.cover === 'own') || (f.photo && !spPhoto(s)) ? 'own' : 'species' };
    var backup = JSON.stringify(db);
    var shownName;
    if (f.edit) {
      var p = find(f.id); if (!p) return closeSheet();
      var lastChanged = p.last !== data.last;
      Object.keys(data).forEach(function(k){ p[k] = data[k]; });
      delete p.prevLast;
      if (lastChanged) { delete p.snooze; if (Array.isArray(p.history) && p.history.length) p.history = p.history.filter(function(x){ return x.d <= data.last; }); }
      if (p.sugDismiss && p.sugDismiss === interval) delete p.sugDismiss;
      shownName = nameOf(p);
    } else {
      data.id = uid(); data.created = iso(TODAY); data.history = [];
      db.plants.push(data);
      shownName = nameOf(data);
    }
    if (!persist()) { db = JSON.parse(backup); return; }
    closeSheet(); render();
    toast(f.edit ? 'Alterações salvas' : shownName + ' entrou no seu jardim');
  }

  function deletePlant(){
    var f = sheet;
    if (!f.confirmDel) { syncForm(); f.confirmDel = true; return renderForm(); }
    var idx = -1;
    for (var i = 0; i < db.plants.length; i++) if (db.plants[i].id === f.id) idx = i;
    if (idx < 0) return closeSheet();
    var removed = db.plants.splice(idx, 1)[0];
    persist(); closeSheet(); render();
    toast(nameOf(removed) + ' saiu do jardim', function(){ db.plants.splice(idx, 0, removed); persist(); render(); });
  }

  // foto: reduz para no máximo 720 px e JPEG, para caber no armazenamento do navegador
  function readPhoto(file, cb){
    if (!file || !/^image\//.test(file.type)) { toast('Escolha um arquivo de imagem'); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var max = 720, w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas'); cv.width = Math.round(w * r); cv.height = Math.round(h * r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cb(cv.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); toast('Não consegui abrir essa imagem'); };
    img.src = url;
  }

  // ---------- card para compartilhar (stories 1080x1920) ----------
  var LEAF_PATH = 'M60 12 C60 12 28 52 28 76 A32 32 0 0 0 92 76 C92 52 60 12 60 12Z';
  var VEINS_PATH = 'M60 104 C60 84 60 56 60 30 M60 80 L45 67 M60 66 L74 54 M60 92 L75 81';
  var story = { blob:null, url:null };

  function loadImg(src){
    return new Promise(function(res){
      if (!src) return res(null);
      var im = new Image();
      if (!/^data:/.test(src) && new URL(src, location.href).origin !== location.origin) im.crossOrigin = 'anonymous';
      im.onload = function(){ res(im); };
      im.onerror = function(){ res(null); };
      im.src = src;
    });
  }
  function rr(ctx, x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(ctx, text, max){
    if (ctx.measureText(text).width <= max) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
    return text.trim() + '…';
  }
  function drawLeaf(ctx, x, y, size, fill, vein){
    ctx.save(); ctx.translate(x, y); ctx.scale(size / 120, size / 120);
    ctx.fillStyle = fill; ctx.fill(new Path2D(LEAF_PATH));
    ctx.strokeStyle = vein; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke(new Path2D(VEINS_PATH));
    ctx.restore();
  }
  function setSpacing(ctx, px){ try { ctx.letterSpacing = px + 'px'; } catch (e) {} }

  function drawStory(items, images){
    var W = 1080, H = 1920, M = 72;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');
    var SERIF = 'Fraunces, Georgia, serif', SANS = '"Plus Jakarta Sans", system-ui, sans-serif';
    var all = items.all, pending = items.pending, okToday = items.okToday;

    ctx.fillStyle = '#333A22'; ctx.fillRect(0, 0, W, H);

    // faixa creme com a marca
    ctx.fillStyle = '#F5F1E3'; ctx.fillRect(0, 0, W, 190);
    ctx.fillStyle = '#E2DAD0'; ctx.fillRect(0, 189, W, 2);
    drawLeaf(ctx, M, 58, 76, '#5E6B3A', '#F5F1E3');
    ctx.fillStyle = '#26331F'; ctx.font = '600 62px ' + SERIF; ctx.textBaseline = 'alphabetic';
    (function(){ // "Irr" + ı + gota rosa + "gua"
      var x0 = M + 92, y0 = 120;
      ctx.fillText('Irr', x0, y0); var w1 = ctx.measureText('Irr').width;
      ctx.fillText('\u0131', x0 + w1, y0); var wi = ctx.measureText('\u0131').width;
      ctx.fillText('gua', x0 + w1 + wi, y0);
      var cx = x0 + w1 + wi / 2, top = y0 - 62 * 0.8, dw = 62 * 0.2, dh = 62 * 0.27;
      ctx.save(); ctx.translate(cx - dw / 2, top); ctx.scale(dw / 10, dh / 13);
      ctx.fillStyle = '#C9837B'; ctx.fill(new Path2D('M5 0 C5 0 0 6 0 8.5 A5 5 0 0 0 10 8.5 C10 6 5 0 5 0Z')); ctx.restore();
      ctx.fillStyle = '#26331F';
    })();
    ctx.font = '600 26px ' + SANS; setSpacing(ctx, 3); ctx.textAlign = 'right'; ctx.fillStyle = '#5E6B3A';
    ctx.fillText('MEU JARDIM', W - M, 116); ctx.textAlign = 'left'; setSpacing(ctx, 0);

    // data + manchete
    ctx.font = '600 30px ' + SANS; setSpacing(ctx, 4); ctx.fillStyle = '#E5ABA4';
    ctx.fillText((DOWL[TODAY.getDay()] + ', ' + TODAY.getDate() + ' de ' + MESL[TODAY.getMonth()]).toUpperCase(), M, 300);
    setSpacing(ctx, 0);
    ctx.fillStyle = '#F5F1E3'; ctx.font = '500 118px ' + SERIF;
    ctx.fillText('Meu jardim', M - 4, 430);
    ctx.fillStyle = '#E5ABA4'; ctx.font = 'italic 400 118px ' + SERIF;
    ctx.fillText(fit(ctx, pending === 0 ? 'está em dia.' : (pending === 1 ? 'tem 1 com sede.' : 'tem ' + pending + ' com sede.'), W - 2 * M), M - 4, 552);

    // mosaico de plantas (até 6)
    var cols = 3, gap = 30, tile = Math.floor((W - 2 * M - gap * (cols - 1)) / cols), top = 640;
    var extra = all.length > 6 ? all.length - 5 : 0;
    var shown = extra ? all.slice(0, 5) : all.slice(0, 6);
    shown.forEach(function(c, i){
      var x = M + (i % cols) * (tile + gap), y = top + Math.floor(i / cols) * (tile + 86);
      ctx.save(); rr(ctx, x, y, tile, tile, 34); ctx.clip();
      var im = images[i];
      if (im) {
        var r = Math.max(tile / im.naturalWidth, tile / im.naturalHeight), iw = im.naturalWidth * r, ih = im.naturalHeight * r;
        ctx.drawImage(im, x + (tile - iw) / 2, y + (tile - ih) / 2, iw, ih);
      } else {
        ctx.fillStyle = '#3E4528'; ctx.fillRect(x, y, tile, tile);
        drawLeaf(ctx, x + tile / 2 - 50, y + tile / 2 - 52, 100, '#A9B98A', '#3E4528');
      }
      ctx.restore();
      if (c.ok) { // selo de regada
        ctx.fillStyle = '#A9B98A'; ctx.beginPath(); ctx.arc(x + tile - 34, y + 34, 22, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#24301A'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(x + tile - 44, y + 35); ctx.lineTo(x + tile - 37, y + 42); ctx.lineTo(x + tile - 24, y + 27); ctx.stroke();
      }
      ctx.fillStyle = '#F5F1E3'; ctx.font = '600 30px ' + SANS;
      ctx.fillText(fit(ctx, c.name, tile), x + 2, y + tile + 46);
    });
    if (extra) {
      var i5 = 5, ex = M + (i5 % cols) * (tile + gap), ey = top + Math.floor(i5 / cols) * (tile + 86);
      ctx.fillStyle = 'rgba(255,255,255,0.07)'; rr(ctx, ex, ey, tile, tile, 34); ctx.fill();
      ctx.fillStyle = '#F5F1E3'; ctx.font = '500 104px ' + SERIF; ctx.textAlign = 'center';
      ctx.fillText('+' + extra, ex + tile / 2, ey + tile / 2 + 36);
      ctx.font = '600 30px ' + SANS; ctx.fillText('plantas', ex + tile / 2, ey + tile + 46); ctx.textAlign = 'left';
    }

    // números
    var rows = Math.ceil(Math.min(all.length, 6) / cols);
    var sy = top + rows * (tile + 86) + 40;
    var pets = all.filter(function(c){ return c.s && c.s.petSafe === true; }).length;
    var pills = [
      all.length + (all.length === 1 ? ' planta' : ' plantas'),
      okToday ? okToday + (okToday === 1 ? ' regada hoje' : ' regadas hoje') : (pending ? pending + ' com sede hoje' : 'nenhuma rega hoje'),
    ];
    if (pets) pills.push(pets + ' pet friendly');
    ctx.font = '600 32px ' + SANS;
    var px = M, py = sy;
    pills.forEach(function(t){
      var w = ctx.measureText(t).width + 56;
      if (px + w > W - M) { px = M; py += 88; }
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; rr(ctx, px, py, w, 70, 35); ctx.fill();
      ctx.fillStyle = '#F5F1E3'; ctx.fillText(t, px + 28, py + 46);
      px += w + 16;
    });

    // rodapé
    ctx.fillStyle = 'rgba(245,241,227,0.14)'; ctx.fillRect(M, H - 210, W - 2 * M, 2);
    ctx.fillStyle = '#E5ABA4'; ctx.font = 'italic 400 46px ' + SERIF;
    ctx.fillText('cuidado no tempo certo', M, H - 128);
    ctx.fillStyle = '#D3D3B5'; ctx.font = '500 28px ' + SANS;
    ctx.fillText((location.host + location.pathname).replace(/index\.html$/, '').replace(/\/$/, '') || 'Irrigua', M, H - 78);
    return cv;
  }

  function buildStory(){
    var all = db.plants.map(compute);
    all.sort(function(a, b){ return (b.cover ? 1 : 0) - (a.cover ? 1 : 0); }); // com foto primeiro
    var items = { all:all, pending:all.filter(function(c){ return c.due; }).length, okToday:all.filter(function(c){ return c.ok; }).length };
    var list = all.length > 6 ? all.slice(0, 5) : all.slice(0, 6);
    var fonts = document.fonts && document.fonts.load ? Promise.all([
      document.fonts.load('500 118px Fraunces'), document.fonts.load('italic 400 118px Fraunces'), document.fonts.load('600 62px Fraunces'),
      document.fonts.load('600 30px "Plus Jakarta Sans"'), document.fonts.load('500 28px "Plus Jakarta Sans"')
    ]).catch(function(){}) : Promise.resolve();
    return fonts.then(function(){ return Promise.all(list.map(function(c){ return loadImg(c.cover); })); }).then(function(imgs){
      var cv = drawStory(items, imgs);
      return new Promise(function(res){
        try { cv.toBlob(function(b){ b ? res(b) : res(null); }, 'image/png'); }
        catch (e) { // alguma foto de fora bloqueou a exportação: refaz sem ela
          var safe = imgs.map(function(im){ return im && (/^data:/.test(im.src) || new URL(im.src).origin === location.origin) ? im : null; });
          drawStory(items, safe).toBlob(function(b){ res(b); }, 'image/png');
        }
      });
    });
  }

  function renderShare(){
    sheetEl.className = 'sheet form';
    sheetEl.setAttribute('aria-label', 'Compartilhar meu jardim');
    var canShareFiles = false;
    try { canShareFiles = !!(navigator.canShare && navigator.canShare({ files:[new File([''], 'a.png', { type:'image/png' })] })); } catch (e) {}
    sheetEl.innerHTML = '<div class="body">' +
      '<div class="fhead"><h2>Compartilhar</h2><button class="close" type="button" data-close aria-label="Fechar">' + I_X + '</button></div>' +
      '<div class="storybox" id="storybox">' + (story.url ? '<img src="' + story.url + '" alt="Card do meu jardim para stories">' : '<div class="wait">Montando o card do seu jardim…</div>') + '</div>' +
      '<p class="hint" style="margin:0">' + (canShareFiles ? 'Toque em <b>Compartilhar</b> e escolha o Instagram para postar nos stories.' : 'Baixe a imagem e poste nos stories pelo celular.') + '</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end">' +
      '<a class="btn plan" id="story-dl" ' + (story.url ? 'href="' + story.url + '" download="irrigua-meu-jardim.png"' : 'aria-disabled="true"') + '>Baixar imagem</a>' +
      (canShareFiles ? '<button class="btn now" type="button" data-share-go' + (story.blob ? '' : ' disabled') + '>Compartilhar</button>' : '') + '</div></div>';
    if (!story.blob && !story.loading) {
      story.loading = true;
      buildStory().then(function(b){
        story.loading = false;
        if (!b) { toast('Não consegui montar a imagem'); return; }
        if (story.url) URL.revokeObjectURL(story.url);
        story.blob = b; story.url = URL.createObjectURL(b);
        if (sheet.mode === 'share') renderShare();
      });
    }
  }
  function shareStory(){
    if (!story.blob) return;
    var file = new File([story.blob], 'irrigua-meu-jardim.png', { type:'image/png' });
    navigator.share({ files:[file], title:'Meu jardim no Irrigua' }).catch(function(){});
  }

  // ---------- avisos no topo ----------
  function renderBanners(all){
    var out = '', st = cfg();
    var mine = db.plants.filter(function(p){ return !p.demo; });
    var demos = db.plants.length - mine.length;
    if (demos) out += '<div class="banner"><div class="t"><b>Você está vendo plantas de exemplo</b>Quando quiser montar o seu jardim, tire os exemplos num toque.</div>' +
      '<span class="row"><button class="btn plan" type="button" data-rmdemo>Remover exemplos</button></span></div>';
    if (mine.length) {
      var ref = st.lastBackup || mine.map(function(p){ return p.created || iso(TODAY); }).sort()[0];
      var days = diff(TODAY, parse(ref) || TODAY);
      var snoozed = st.backupSnooze && diff(parse(st.backupSnooze) || TODAY, TODAY) > 0;
      if (days >= 30 && !snoozed) out += '<div class="banner warn"><div class="t"><b>' + (st.lastBackup ? 'Seu último backup foi há ' + days + ' dias' : 'Você ainda não salvou um backup') + '</b>Seu jardim fica só neste aparelho. Um backup garante que nada se perde se o navegador for limpo.</div>' +
        '<span class="row"><button class="btn now" type="button" data-backup-now>Salvar backup</button><button class="btn plan" type="button" data-backup-later>Depois</button></span></div>';
    }
    var m = TODAY.getMonth();
    if (mine.length && !st.winter && m >= 5 && m <= 7 && st.winterAsked !== TODAY.getFullYear()) out += '<div class="banner"><div class="t"><b>Está frio por aí?</b>No inverno as plantas bebem menos. O modo inverno espaça as regas em cerca de 30%.</div>' +
      '<span class="row"><button class="btn now" type="button" data-winter-on>Ligar modo inverno</button><button class="btn plan" type="button" data-winter-no>Agora não</button></span></div>';
    document.getElementById('banners').innerHTML = out;
  }
  function removeDemos(){
    var before = db.plants.slice();
    db.plants = db.plants.filter(function(p){ return !p.demo; });
    persist(); render();
    toast('Exemplos removidos', function(){ db.plants = before; persist(); render(); });
  }

  // ---------- ajustes ----------
  function renderSettings(){
    var st = cfg();
    sheetEl.className = 'sheet form';
    sheetEl.setAttribute('aria-label', 'Ajustes');
    var demos = db.plants.filter(function(p){ return p.demo; }).length;
    sheetEl.innerHTML = '<div class="body">' +
      '<div class="fhead"><h2>Ajustes</h2><button class="close" type="button" data-close aria-label="Fechar">' + I_X + '</button></div>' +
      '<div class="switch"><div class="t"><b>Modo inverno</b><span>Espaça as regas em cerca de 30% nos meses frios. Uma planta de 7 dias passa para 9. Desligue quando o calor voltar.</span></div>' +
      '<button class="tg" type="button" data-winter-toggle aria-pressed="' + !!st.winter + '" aria-label="Modo inverno"></button></div>' +
      '<div class="field"><span class="lbl">Lembrete diário no calendário</span>' +
      '<p class="hint" style="margin:0">Cria um evento que se repete todo dia no calendário do seu celular, com notificação, para você lembrar de abrir a Irrigua. Ele não sabe quais plantas estão com sede: só te chama para olhar o jardim.</p>' +
      '<div class="inline"><label for="s-time" class="sr">Horário do lembrete</label><input id="s-time" type="time" value="' + esc(st.remindTime || '08:00') + '" style="height:48px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--texto);font:inherit;color-scheme:dark">' +
      '<button class="btn plan" type="button" data-ics>Adicionar ao calendário</button></div></div>' +
      '<div class="field"><span class="lbl">Backup</span><p class="hint" style="margin:0">' + (st.lastBackup ? 'Último backup: ' + fmt(parse(st.lastBackup)) + '.' : 'Você ainda não salvou nenhum backup.') + ' Os dados ficam só neste aparelho.</p>' +
      '<div class="row" style="justify-content:flex-start"><button class="btn plan" type="button" data-backup-now>Exportar backup</button>' +
      '<span class="btn plan filebtn">Importar backup<input type="file" id="importar2" accept="application/json,.json" aria-label="Importar backup"></span></div></div>' +
      (demos ? '<div class="field"><span class="lbl">Plantas de exemplo</span><div class="row" style="justify-content:flex-start"><button class="btn plan" type="button" data-rmdemo>Remover ' + demos + ' exemplos</button></div></div>' : '') +
      '</div>';
  }
  function downloadIcs(){
    var st = cfg();
    var tEl = document.getElementById('s-time');
    var time = (tEl && /^\d{2}:\d{2}$/.test(tEl.value)) ? tEl.value : '08:00';
    st.remindTime = time; persist();
    var hh = +time.slice(0, 2), mm = +time.slice(3, 5);
    var start = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate(), hh, mm);
    if (start < new Date()) start = add(start, 1);
    function pad(n){ return String(n).padStart(2, '0'); }
    function local(d){ return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; }
    var now = new Date();
    var stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';
    var url = location.origin + location.pathname.replace(/index\.html$/, '');
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Irrigua//Lembrete diario//PT-BR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT', 'UID:irrigua-lembrete-' + Date.now() + '@irrigua', 'DTSTAMP:' + stamp, 'DTSTART:' + local(start), 'DURATION:PT10M', 'RRULE:FREQ=DAILY',
      'SUMMARY:Ver o jardim na Irrigua', 'DESCRIPTION:Quem está com sede hoje? ' + url, 'URL:' + url, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Ver o jardim na Irrigua', 'TRIGGER:PT0M', 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n') + '\r\n';
    var blob = new Blob([ics], { type:'text/calendar;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'irrigua-lembrete.ics';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Abra o arquivo baixado para adicionar o lembrete das ' + time);
  }

  // ---------- exemplo ----------
  function loadDemo(){
    var demo = [['aglaonema',7,7],['palmeira',5,5],['lirio',3,2],['comigo',6,4],['bambu',7,8],['dracena',10,9]];
    var hist = function(d){ var h = [], last = add(TODAY, -d[2]); for (var i = 2; i >= 0; i--) h.push({ d:iso(add(last, -i * d[1])) }); return h; };
    db.plants = demo.map(function(d){ return { id:uid(), sp:d[0], name:'', interval:d[1], light:'indireta', last:iso(add(TODAY, -d[2])), photo:null, cover:'species', created:iso(TODAY), demo:true, history:hist(d) }; });
    db.plants[0].room = 'Sala'; db.plants[1].room = 'Sala'; db.plants[2].room = 'Quarto'; db.plants[3].room = 'Varanda'; db.plants[4].room = 'Quarto'; db.plants[5].room = 'Sala';
    db.plants[1].tasks = { borrifar:{ on:true, interval:3, last:iso(add(TODAY, -3)) } };
    db.plants[0].tasks = { adubar:{ on:true, interval:30, last:iso(add(TODAY, -20)) } };
    persist(); render();
    toast('Plantas de exemplo adicionadas', function(){ db.plants = []; persist(); render(); });
  }

  // ---------- backup ----------
  function exportBackup(){
    cfg().lastBackup = iso(TODAY); delete cfg().backupSnooze; persist();
    var blob = new Blob([JSON.stringify({ app:'irrigua', v:2, exported:new Date().toISOString(), plants:db.plants, settings:db.settings || {} }, null, 2)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'irrigua-backup-' + iso(TODAY) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Backup exportado'); render(); if (sheet.mode === 'settings') renderSettings();
  }
  function importBackup(file){
    var r = new FileReader();
    r.onload = function(){
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.plants)) throw new Error('formato');
        var ok = d.plants.every(function(p){ return p && typeof p.id === 'string' && Number(p.interval) >= 1 && parse(p.last); });
        if (!ok) throw new Error('formato');
        if (db.plants.length && !window.confirm('Substituir o jardim atual (' + db.plants.length + ' plantas) pelo backup (' + d.plants.length + ' plantas)?')) return;
        var prev = db.plants;
        db.plants = d.plants;
        if (d.settings && typeof d.settings === 'object') { var keepBk = cfg().lastBackup; db.settings = d.settings; if (keepBk && (!db.settings.lastBackup || keepBk > db.settings.lastBackup)) db.settings.lastBackup = keepBk; }
        if (!persist()) { db.plants = prev; return; }
        render(); toast('Backup importado: ' + d.plants.length + ' plantas');
      } catch (e) { toast('Esse arquivo não é um backup da Irrigua'); }
    };
    r.readAsText(file);
  }

  // ---------- eventos ----------
  document.addEventListener('click', function(e){
    var el;
    if ((el = e.target.closest('[data-water]'))) { toggleWater(el.getAttribute('data-water')); return; }
    if ((el = e.target.closest('[data-snooze]'))) { snoozePlant(el.getAttribute('data-snooze')); return; }
    if ((el = e.target.closest('[data-soil]'))) { var sv = el.getAttribute('data-soil').split('|'); setSoil(sv[0], sv[1]); return; }
    if ((el = e.target.closest('[data-task]'))) { var tv = el.getAttribute('data-task').split('|'); toggleTask(tv[0], tv[1]); return; }
    if ((el = e.target.closest('[data-sugg-apply]'))) { var sp1 = find(el.getAttribute('data-sugg-apply')), sg = sp1 && adjustSuggestion(sp1);
      if (sg) { var was = sp1.interval, wasAdj = sp1.adjustedAt; sp1.interval = sg.to; sp1.adjustedAt = iso(TODAY); persist(); render(); toast(nameOf(sp1) + ': agora a cada ' + sg.to + ' dias', function(){ sp1.interval = was; if (wasAdj) sp1.adjustedAt = wasAdj; else delete sp1.adjustedAt; persist(); render(); }); } return; }
    if ((el = e.target.closest('[data-sugg-skip]'))) { var sp2 = find(el.getAttribute('data-sugg-skip')), sg2 = sp2 && adjustSuggestion(sp2); if (sg2) { sp2.adjustedAt = iso(TODAY); persist(); render(); toast('Mantido a cada ' + sp2.interval + ' dias'); } return; }
    if ((el = e.target.closest('[data-room]'))) { roomFilter = el.getAttribute('data-room'); render(); return; }
    if (e.target.closest('[data-settings]')) { openSheet({ mode:'settings' }); return; }
    if (e.target.closest('[data-winter-toggle]')) { cfg().winter = !cfg().winter; persist(); render(); renderSettings(); toast(cfg().winter ? 'Modo inverno ligado: regas mais espaçadas' : 'Modo inverno desligado'); return; }
    if (e.target.closest('[data-winter-on]')) { cfg().winter = true; persist(); render(); toast('Modo inverno ligado: regas mais espaçadas'); return; }
    if (e.target.closest('[data-winter-no]')) { cfg().winterAsked = TODAY.getFullYear(); persist(); render(); return; }
    if (e.target.closest('[data-backup-now]')) { exportBackup(); return; }
    if (e.target.closest('[data-backup-later]')) { cfg().backupSnooze = iso(add(TODAY, 7)); persist(); render(); return; }
    if (e.target.closest('[data-rmdemo]')) { removeDemos(); if (sheet.mode === 'settings') renderSettings(); return; }
    if (e.target.closest('[data-ics]')) { downloadIcs(); return; }
    if ((el = e.target.closest('[data-info]'))) { openSheet({ mode:'info', id:el.getAttribute('data-info') }); return; }
    if (e.target.closest('[data-share]')) { openSheet({ mode:'share' }); return; }
    if (e.target.closest('[data-share-go]')) { shareStory(); return; }
    if ((el = e.target.closest('[data-add]'))) { openSheet({ mode:'pick', q:el.getAttribute('data-q') || '' }); return; }
    if (e.target.closest('#demo')) { loadDemo(); return; }
    if (e.target.closest('[data-close]') || e.target === overlay) { closeSheet(); return; }
    if ((el = e.target.closest('[data-edit]'))) { openSheet(formFromPlant(find(el.getAttribute('data-edit')))); return; }
    if ((el = e.target.closest('[data-pick]'))) {
      var id = el.getAttribute('data-pick');
      if (sheet.editing) { var keep = sheet.editing; keep.sp = id; var s = sp(id); if (!keep.touched || !keep.interval) keep.interval = suggest(s, keep.light); keep.touched = true; sheet = keep; return renderSheet(); }
      sheet = newForm(id, sheet.q); return renderSheet();
    }
    if (e.target.closest('[data-manual]')) {
      if (sheet.editing) { var k2 = sheet.editing; k2.sp = null; sheet = k2; return renderSheet(); }
      sheet = newForm(null, sheet.q); return renderSheet();
    }
    if (sheet.mode === 'form') {
      if (e.target.closest('[data-back]')) { syncForm(); sheet = { mode:'pick', q:sheet.q || '' }; return renderSheet(); }
      if (e.target.closest('[data-change-sp]')) { syncForm(); var cur = sheet; sheet = { mode:'pick', q:'', editing:cur }; return renderSheet(); }
      if ((el = e.target.closest('[data-light]'))) { syncForm(); sheet.light = el.getAttribute('data-light'); var s2 = sp(sheet.sp); if (s2 && !sheet.touched) sheet.interval = suggest(s2, sheet.light); return renderForm(); }
      if (e.target.closest('[data-use-sugg]')) { syncForm(); sheet.interval = suggest(sp(sheet.sp), sheet.light); sheet.touched = false; return renderForm(); }
      if ((el = e.target.closest('[data-last]'))) { syncForm(); sheet.last = iso(add(TODAY, -Number(el.getAttribute('data-last')))); return renderForm(); }
      if ((el = e.target.closest('[data-cover]'))) { syncForm(); sheet.cover = el.getAttribute('data-cover'); return renderForm(); }
      if (e.target.closest('[data-rmphoto]')) { syncForm(); sheet.photo = null; sheet.cover = 'species'; return renderForm(); }
      if ((el = e.target.closest('[data-setroom]'))) { syncForm(); sheet.room = el.getAttribute('data-setroom'); return renderForm(); }
      if ((el = e.target.closest('[data-tasktoggle]'))) { syncForm(); var tk = sheet.tasks[el.getAttribute('data-tasktoggle')]; tk.on = !tk.on; return renderForm(); }
      if (e.target.closest('[data-save]')) { saveForm(); return; }
      if (e.target.closest('[data-delete]')) { deletePlant(); return; }
    }
  });
  document.addEventListener('input', function(e){
    if (e.target.id === 'q' && sheet.mode === 'pick') { sheet.q = e.target.value; document.getElementById('pick').innerHTML = pickList(); }
    if (e.target.id === 'f-int' && sheet.mode === 'form') { sheet.touched = true; }
    if (e.target.id === 'busca') { query = e.target.value; render(); }
  });
  document.addEventListener('change', function(e){
    if (e.target.id === 'f-photo' && e.target.files && e.target.files[0]) {
      syncForm();
      readPhoto(e.target.files[0], function(data){ if (sheet.mode !== 'form') return; sheet.photo = data; sheet.cover = 'own'; renderForm(); });
    }
    if ((e.target.id === 'importar' || e.target.id === 'importar2') && e.target.files && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && sheet.mode) { closeSheet(); }
    if (e.key === 'Enter' && sheet.mode === 'form' && e.target.tagName === 'INPUT' && e.target.type !== 'file') { e.preventDefault(); saveForm(); }
  });
  document.getElementById('limpar').addEventListener('click', function(){ var b = document.getElementById('busca'); b.value = ''; query = ''; render(); b.focus(); });
  document.getElementById('desfazer').addEventListener('click', function(){ var u = undo; hideToast(); if (u) u(); });
  document.getElementById('exportar').addEventListener('click', exportBackup);
  var fixed = false;
  db.plants.forEach(function(p){ if (!Array.isArray(p.history)) { p.history = []; fixed = true; } });
  if (fixed) persist();

  // voltou para a página (ou virou o dia)? atualiza data e saudação
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') { TODAY = startOf(new Date()); render(); }
  });
  setInterval(function(){ if (document.visibilityState === 'visible' && !sheet.mode) { TODAY = startOf(new Date()); render(); } }, 10 * 60 * 1000);

  render();
  if (location.hash === '#explorar') { history.replaceState(null, '', location.pathname); openSheet({ mode:'pick', q:'' }); }

  // app instalável e funcionando sem internet
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
